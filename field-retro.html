<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Retro Ballpark</title>
  </head>
  <body style="margin:0;display:grid;place-items:center;height:100vh;background:#f7f1e5;">
    <svg width="360" height="480" viewBox="0 0 360 480" xmlns="http://www.w3.org/2000/svg">
      <rect width="360" height="480" rx="24" fill="#7A9B6E" />
      <circle cx="180" cy="260" r="140" fill="#D2A679" />
      <rect x="164" y="90" width="32" height="32" rx="4" fill="#F8F2E7" />
      <rect x="92" y="260" width="28" height="28" rx="4" fill="#F8F2E7" />
      <rect x="240" y="260" width="28" height="28" rx="4" fill="#F8F2E7" />
      <rect x="168" y="332" width="24" height="24" rx="4" fill="#F8F2E7" />
      <text x="180" y="40" text-anchor="middle" font-family="DM Serif Display, serif" font-size="18" fill="#2A2A2A">Team Manager</text>
      <g font-family="Work Sans, sans-serif" font-size="12" fill="#2A2A2A">
        <text x="180" y="380" text-anchor="middle">Catcher</text>
        <text x="180" y="290" text-anchor="middle">Pitcher</text>
        <text x="260" y="285" text-anchor="middle">1B</text>
        <text x="100" y="285" text-anchor="middle">3B</text>
        <text x="180" y="190" text-anchor="middle">2B</text>
        <text x="140" y="220" text-anchor="middle">SS</text>
        <text x="60" y="130" text-anchor="middle">LF</text>
        <text x="180" y="110" text-anchor="middle">CF</text>
        <text x="300" y="130" text-anchor="middle">RF</text>
      </g>
    </svg>
  </body>
</html>
